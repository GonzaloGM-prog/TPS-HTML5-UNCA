<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscripción - Deportes UNCA</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-inscripcion">

    <header>
        <h1>Deportes UNCA</h1>
        <p>Plataforma de actividades deportivas</p>
    </header>

    <nav>
        <ul>
            <li>
                <a href="index.html">Inicio</a>
            </li>

            <li>
                <a href="inscripcion.html">Inscripción</a>
            </li>

            <li>
                <a href="inscripciones.html">Inscripciones</a>
            </li>
        </ul>
    </nav>

    <main>

        <section class="formulario-contenedor">

            <h2>Formulario de inscripción</h2>

            <p>
                Completá los siguientes datos para realizar tu inscripción
                a una actividad deportiva.
            </p>

            <form>

                <fieldset>

                    <legend>Datos personales</legend>

                    <label for="nombre">Nombre:</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresá tu nombre"
                        required
                    >

                    <label for="apellido">Apellido:</label>
                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        placeholder="Ingresá tu apellido"
                        required
                    >

                    <label for="email">Correo electrónico:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                    <label for="telefono">Teléfono:</label>
                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="Ingresá tu teléfono"
                    >

                </fieldset>

                <fieldset>

                    <legend>Actividad deportiva</legend>

                    <label for="deporte">Elegí un deporte:</label>

                    <select id="deporte" name="deporte" required>

                        <option value="">
                            Seleccioná una opción
                        </option>

                        <option value="futbol">
                            Fútbol
                        </option>

                        <option value="basquet">
                            Básquet
                        </option>

                        <option value="voley">
                            Vóley
                        </option>

                        <option value="atletismo">
                            Atletismo
                        </option>

                    </select>

                    <label>Turno:</label>

                    <div class="opciones">

                        <label>
                            <input
                                type="radio"
                                name="turno"
                                value="manana"
                            >
                            Mañana
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="turno"
                                value="tarde"
                            >
                            Tarde
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="turno"
                                value="noche"
                            >
                            Noche
                        </label>

                    </div>

                    <label>Experiencia previa:</label>

                    <div class="opciones">

                        <label>
                            <input
                                type="radio"
                                name="experiencia"
                                value="si"
                            >
                            Sí
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="experiencia"
                                value="no"
                            >
                            No
                        </label>

                    </div>

                    <label for="comentarios">
                        Comentarios:
                    </label>

                    <textarea
                        id="comentarios"
                        name="comentarios"
                        placeholder="Escribí algún comentario..."
                    ></textarea>

                </fieldset>

                <div class="condiciones">

                    <input
                        type="checkbox"
                        id="condiciones"
                        name="condiciones"
                        required
                    >

                    <label for="condiciones">
                        Acepto las condiciones de inscripción.
                    </label>

                </div>

                <div class="botones-formulario">

                    <button
                        type="submit"
                        class="btn-enviar"
                    >
                        Enviar inscripción
                    </button>

                    <button
                        type="reset"
                        class="btn-cancelar"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </section>

    </main>

    <footer>
        <p>Deportes UNCA – 2026</p>
    </footer>

</body>

</html>
