<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción a actividad deportiva</title>
</head>

<body>

    <form action="pagina3.html" method="post">

        <h1>Inscripción a actividad deportiva</h1>

        <h2>Información de la actividad</h2>

        <label for="actividad">Actividad:</label>
        <input type="text" id="actividad" value="Futbol" disabled>
        <br>

        <label for="lugar">Lugar:</label>
        <input type="text" id="lugar" value="Cancha techada" disabled>
        <br>

        <label for="dias">Días:</label>
        <input type="text" id="dias" value="Martes y Jueves" disabled>
        <br>

        <label for="horario">Horario:</label>
        <input type="text" id="horario" value="18:00 a 19:30" disabled>
        <br>


        <h2>Datos del participante</h2>

        <label for="nombre">Nombre y Apellido:</label>
        <input type="text" id="nombre" maxlength="100" required>
        <br>

        <label for="dni">DNI:</label>
        <input type="text" id="dni" pattern="[0-9]{8}" required>
        <br>

        <label for="fecha">Fecha de nacimiento:</label>
        <input type="date" id="fecha">
        <br>

        <label for="email">Email:</label>
        <input type="email" id="email">
        <br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono">
        <br>

        <label>Sexo:</label>

        <input type="radio" id="masculino" name="sexo" value="Masculino">
        <label for="masculino">Masculino</label>

        <input type="radio" id="femenino" name="sexo" value="Femenino">
        <label for="femenino">Femenino</label>

        <input type="radio" id="no-binario" name="sexo" value="No binario">
        <label for="no-binario">No binario</label>

        <br>


        <h2>Información deportiva</h2>

        <label for="nivel">Nivel:</label>

        <select id="nivel">
            <option value="inicial">Inicial</option>
            <option value="intermedio">Intermedio</option>
            <option value="avanzado">Avanzado</option>
        </select>

        <br>

        <p>¿Posee experiencia previa?</p>

        <input type="radio" id="experiencia-si" name="experiencia" value="Si">
        <label for="experiencia-si">Sí</label>

        <input type="radio" id="experiencia-no" name="experiencia" value="No">
        <label for="experiencia-no">No</label>

        <br>

        <label for="observaciones">Observaciones:</label>
        <br>

        <textarea
            id="observaciones"
            cols="30"
            rows="10"
            placeholder="Escribe aquí información adicional">
        </textarea>

        <br>


        <h2>Aceptación de condiciones</h2>

        <input type="checkbox" id="condiciones" name="condiciones" value="Si" required>
        <label for="condiciones">Acepto las condiciones de inscripción</label>

        <br><br>

        <button type="submit">Aceptar</button>
        <button type="reset">Cancelar</button>

    </form>

</body>
</html>
